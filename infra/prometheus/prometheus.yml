global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: zhyf-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:18080
          - host.docker.internal:18081
          - host.docker.internal:18082
          - host.docker.internal:18083
          - host.docker.internal:18084
          - host.docker.internal:18085
          - host.docker.internal:18086
          - host.docker.internal:18087
          - host.docker.internal:18088
          - host.docker.internal:18089
          - host.docker.internal:18090
          - host.docker.internal:18091
          - host.docker.internal:18092
