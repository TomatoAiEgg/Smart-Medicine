server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/logistics/(deliveries|traces|print|merges|unreceived-followups)/?$ {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/decoction/(equipment|prescription-bindings|pda-printer-relations|water-pails|cloud-print-records)/?$ {
        try_files $uri $uri/ /index.html;
    }

    location /order-api/ {
        proxy_pass http://zhyf-order-service:18082/;
        include /etc/nginx/proxy_params;
    }

    location /workflow-api/ {
        proxy_pass http://zhyf-workflow-service:18085/;
        include /etc/nginx/proxy_params;
    }

    location /decoction-api/ {
        proxy_pass http://zhyf-decoction-service:18087/;
        include /etc/nginx/proxy_params;
    }

    location /ops-api/ {
        proxy_pass http://zhyf-ops-service:18086/;
        include /etc/nginx/proxy_params;
    }

    location /logistics-api/ {
        proxy_pass http://zhyf-logistics-service:18088/;
        include /etc/nginx/proxy_params;
    }

    location /callback-api/ {
        proxy_pass http://zhyf-callback-service:18089/;
        include /etc/nginx/proxy_params;
    }

    location /portal-api/ {
        proxy_pass http://zhyf-portal-service:18090/;
        include /etc/nginx/proxy_params;
    }

    location /report-api/ {
        proxy_pass http://zhyf-report-service:18091/;
        include /etc/nginx/proxy_params;
    }

    location /integration-api/ {
        proxy_pass http://zhyf-integration-service:18092/;
        include /etc/nginx/proxy_params;
    }

    location /api/institution/ {
        proxy_pass http://zhyf-gateway:18080/api/institution/;
        include /etc/nginx/proxy_params;
    }

    location /logistics/ {
        proxy_pass http://zhyf-logistics-service:18088/logistics/;
        include /etc/nginx/proxy_params;
    }
}
