server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location /health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/logistics/(deliveries|traces|print|merges|unreceived-followups)/?$ {
        try_files $uri $uri/ /index.html;
    }

    location /order-api/ {
        proxy_pass http://host.docker.internal:18082/;
        include /etc/nginx/proxy_params;
    }

    location /workflow-api/ {
        proxy_pass http://host.docker.internal:18085/;
        include /etc/nginx/proxy_params;
    }

    location /decoction-api/ {
        proxy_pass http://host.docker.internal:18087/;
        include /etc/nginx/proxy_params;
    }

    location /ops-api/ {
        proxy_pass http://host.docker.internal:18086/;
        include /etc/nginx/proxy_params;
    }

    location /logistics-api/ {
        proxy_pass http://host.docker.internal:18088/;
        include /etc/nginx/proxy_params;
    }

    location /callback-api/ {
        proxy_pass http://host.docker.internal:18089/;
        include /etc/nginx/proxy_params;
    }

    location /portal-api/ {
        proxy_pass http://host.docker.internal:18090/;
        include /etc/nginx/proxy_params;
    }

    location /report-api/ {
        proxy_pass http://host.docker.internal:18091/;
        include /etc/nginx/proxy_params;
    }

    location /integration-api/ {
        proxy_pass http://host.docker.internal:18092/;
        include /etc/nginx/proxy_params;
    }
}
