    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: portal-service
        JAR_FILE: backend/portal-service/target/portal-service-0.1.0-SNAPSHOT.jar
    container_name: zhyf-portal-service
    environment:
      <<: *backend-env
      PORTAL_SERVICE_PORT: 18090
      JAVA_OPTS: ${ZHYF_PORTAL_JAVA_OPTS:--XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:18090:18090"
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18090/actuator/health >/dev/null"]

  zhyf-report-service:
    <<: *service-common
    image: ${ZHYF_IMAGE_NAMESPACE:-zhyf}/report-service:${ZHYF_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: report-service
        JAR_FILE: backend/report-service/target/report-service-0.1.0-SNAPSHOT.jar
    container_name: zhyf-report-service
    environment:
      <<: *backend-env
      REPORT_SERVICE_PORT: 18091
      JAVA_OPTS: ${ZHYF_REPORT_JAVA_OPTS:--XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:18091:18091"
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18091/actuator/health >/dev/null"]

  zhyf-integration-service:
    <<: *service-common
    image: ${ZHYF_IMAGE_NAMESPACE:-zhyf}/integration-service:${ZHYF_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: integration-service
        JAR_FILE: backend/integration-service/target/integration-service-0.1.0-SNAPSHOT.jar
    container_name: zhyf-integration-service
    environment:
      <<: *backend-env
      INTEGRATION_SERVICE_PORT: 18092
      JAVA_OPTS: ${ZHYF_INTEGRATION_JAVA_OPTS:--XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:18092:18092"
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18092/actuator/health >/dev/null"]

  zhyf-gateway:
    <<: *service-common
    image: ${ZHYF_IMAGE_NAMESPACE:-zhyf}/gateway:${ZHYF_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        SERVICE_NAME: gateway
        JAR_FILE: backend/gateway/target/gateway-0.1.0-SNAPSHOT.jar
    container_name: zhyf-gateway
    environment:
      <<: *backend-env
      GATEWAY_PORT: 18080
      AUTH_INSTITUTION_BASE_URL: http://zhyf-auth-institution:18081
      ORDER_SERVICE_BASE_URL: http://zhyf-order-service:18082
      JAVA_OPTS: ${ZHYF_GATEWAY_JAVA_OPTS:--XX:InitialRAMPercentage=35 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError}
    ports:
      - "127.0.0.1:18080:18080"
    healthcheck:
      <<: *health-defaults
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:18080/actuator/health >/dev/null"]

  zhyf-admin-web:
    image: ${ZHYF_IMAGE_NAMESPACE:-zhyf}/admin-web:${ZHYF_IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: frontend/admin-web/Dockerfile
    container_name: zhyf-admin-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      zhyf-gateway:
        condition: service_healthy
      zhyf-order-service:
        condition: service_healthy
      zhyf-ops-service:
        condition: service_healthy
    networks:
      - zhyf

  zhyf-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: zhyf-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/image-deploy.yml:/etc/prometheus/prometheus.yml:ro
      - zhyf-prometheus-data:/prometheus
    depends_on:
      - zhyf-admin-web
    networks:
      - zhyf

  zhyf-grafana:
    image: grafana/grafana:11.2.0
    container_name: zhyf-grafana
    restart: unless-stopped
    depends_on:
      - zhyf-prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${ZHYF_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ZHYF_GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "13000:3000"
    volumes:
      - zhyf-grafana-data:/var/lib/grafana
    networks:
      - zhyf

networks:
  zhyf:
    name: zhyf

volumes:
  zhyf-postgres-data:
  zhyf-redis-data:
  zhyf-rocketmq-store:
  zhyf-prometheus-data:
  zhyf-grafana-data:
