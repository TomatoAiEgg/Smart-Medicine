server:
  port: ${AUTH_INSTITUTION_PORT:18081}

spring:
  application:
    name: auth-institution
  datasource:
    url: jdbc:postgresql://${ZHYF_DB_HOST:47.120.55.53}:${ZHYF_DB_PORT:15432}/${ZHYF_DB_NAME:zhyf_saas}
    username: ${ZHYF_DB_USERNAME:postgres}
    password: ${ZHYF_DB_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

zhyf:
  admin-data-scope:
    enabled: false
  admin-auth:
    jwt-secret: ${ZHYF_ADMIN_JWT_SECRET:}
    issuer: ${ZHYF_ADMIN_JWT_ISSUER:zhyf-admin}
    access-token-seconds: ${ZHYF_ADMIN_ACCESS_TOKEN_SECONDS:28800}
    max-login-failures: ${ZHYF_ADMIN_MAX_LOGIN_FAILURES:5}
    lock-seconds: ${ZHYF_ADMIN_LOCK_SECONDS:900}
