<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#076fb4">
  <meta name="description" content="广州诚友工业自动化设备有限公司产品宣传册">
  <title>诚友产品宣传册</title>
  <style>
    :root {
      --brand-blue: #076fb4;
      --brand-blue-dark: #04517f;
      --brand-yellow: #efbd3a;
      --ink: #123247;
      --muted: rgba(18, 50, 71, 0.68);
      --paper: #f4f8fb;
      --panel: rgba(255, 255, 255, 0.86);
      --shadow: 0 20px 60px rgba(4, 41, 69, 0.18);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 6%, rgba(239, 189, 58, 0.32), transparent 26rem),
        radial-gradient(circle at 88% 18%, rgba(7, 111, 180, 0.22), transparent 28rem),
        linear-gradient(135deg, #edf6fb 0%, #f9fbfd 44%, #eef4f8 100%);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    button,
    a {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .topbar {
      position: fixed;
      z-index: 20;
      top: calc(12px + var(--safe-top));
      left: 50%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      width: min(1120px, calc(100% - 24px));
      min-height: 52px;
      padding: 10px 12px 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 30px rgba(16, 72, 111, 0.12);
      transform: translateX(-50%);
      backdrop-filter: blur(18px);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand-blue), #0d8fd7);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-text {
      min-width: 0;
      line-height: 1.2;
    }

    .brand-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 600;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(7, 111, 180, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.68);
      color: var(--brand-blue-dark);
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .tool-button:hover,
    .tool-button:focus-visible {
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 20px rgba(7, 111, 180, 0.14);
      transform: translateY(-1px);
      outline: none;
    }

    .tool-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .download-label {
      margin-left: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .progress {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(7, 111, 180, 0.12);
    }

    .progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--brand-blue), var(--brand-yellow));
      transition: width 220ms ease;
    }

    .viewer {
      height: 100%;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .viewer::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .slide {
      position: relative;
      display: grid;
      min-height: 100svh;
      padding: calc(82px + var(--safe-top)) 16px calc(78px + var(--safe-bottom));
      place-items: center;
      scroll-snap-align: start;
      scroll-snap-stop: always;
    }

    .page-shell {
      position: relative;
      width: min(76vh, 92vw, 760px);
      aspect-ratio: 596 / 809;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.44));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .slide:first-child .page-shell {
      box-shadow: 0 26px 80px rgba(4, 67, 111, 0.25);
    }

    .page-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #fff;
    }

    .cover-badge {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 6px;
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(7, 111, 180, 0.94), rgba(4, 81, 127, 0.92));
      color: #fff;
      box-shadow: 0 16px 40px rgba(4, 67, 111, 0.28);
    }

    .cover-badge strong {
      font-size: 17px;
      font-weight: 600;
    }

    .cover-badge span {
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
    }

    .page-number {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--brand-blue-dark);
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(7, 111, 180, 0.12);
      backdrop-filter: blur(10px);
    }

    .slide:first-child .page-number {
      display: none;
    }

    .rail {
      position: fixed;
      z-index: 18;
      top: 50%;
      right: max(14px, calc((100vw - 1120px) / 2));
      display: grid;
      gap: 9px;
      transform: translateY(-50%);
    }

    .dot {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(7, 111, 180, 0.24);
      cursor: pointer;
      transition: transform 180ms ease, background 180ms ease;
    }

    .dot[aria-current="true"] {
      background: var(--brand-blue);
      transform: scale(1.55);
    }

    .bottom-hint {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: calc(48px + var(--safe-bottom));
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      box-shadow: 0 12px 30px rgba(16, 72, 111, 0.12);
      font-size: 12px;
      transform: translateX(-50%);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .chevron {
      width: 16px;
      height: 16px;
      animation: float 1.4s ease-in-out infinite;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(-2px);
      }
      50% {
        transform: translateY(3px);
      }
    }

    .is-last .bottom-hint {
      opacity: 0;
      transform: translate(-50%, 12px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .counter {
      font-variant-numeric: tabular-nums;
    }

    .site-footer {
      position: fixed;
      z-index: 19;
      left: 50%;
      bottom: calc(12px + var(--safe-bottom));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: min(92vw, 720px);
      padding: 7px 12px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 10px 24px rgba(16, 72, 111, 0.1);
      color: rgba(18, 50, 71, 0.74);
      font-size: 12px;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(14px);
    }

    .site-footer a {
      color: var(--brand-blue-dark);
      text-decoration: none;
      font-weight: 600;
    }

    .site-footer a:hover,
    .site-footer a:focus-visible {
      text-decoration: underline;
      outline: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: minmax(0, 1fr) auto;
        width: calc(100% - 18px);
        min-height: 48px;
        padding: 8px 9px 8px 12px;
        border-radius: 16px;
      }

      .mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        font-size: 13px;
      }

      .brand-title {
        font-size: 13px;
      }

      .brand-subtitle,
      .download-label {
        display: none;
      }

      .tool-button {
        min-width: 34px;
        height: 34px;
        padding: 0 9px;
        border-radius: 11px;
      }

      .slide {
        padding: calc(72px + var(--safe-top)) 10px calc(92px + var(--safe-bottom));
      }

      .page-shell {
        width: min(74vh, 94vw);
        border-radius: 16px;
      }

      .cover-badge {
        left: 12px;
        right: 12px;
        bottom: 12px;
        padding: 12px 13px;
        border-radius: 13px;
      }

      .cover-badge strong {
        font-size: 14px;
      }

      .rail {
        right: 7px;
        gap: 7px;
      }

      .dot {
        width: 6px;
        height: 6px;
      }

      .bottom-hint {
        bottom: calc(44px + var(--safe-bottom));
        padding: 8px 12px;
      }

      .site-footer {
        bottom: calc(8px + var(--safe-bottom));
        width: min(96vw, 520px);
        padding: 6px 10px;
        font-size: 11px;
      }
    }

    @media (max-width: 420px) {
      .brand {
        gap: 8px;
      }

      .page-shell {
        width: min(73vh, 96vw);
      }

      .rail {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .viewer {
        scroll-behavior: auto;
      }

      .chevron {
        animation: none;
      }

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

    <header class="topbar" aria-label="宣传册工具栏">
      <div class="brand">
        <div class="mark" aria-hidden="true">CY</div>
        <div class="brand-text">
          <div class="brand-title">广州诚友工业自动化设备有限公司</div>
          <div class="brand-subtitle">产品宣传册 · 2022</div>
        </div>
      </div>
      <div class="toolbar">
        <button class="tool-button" type="button" id="prevBtn" aria-label="上一页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>
        </button>
        <button class="tool-button" type="button" id="nextBtn" aria-label="下一页">

        </div>
      </article>
      <article class="slide" aria-label="第 2 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-02.webp" width="1340" height="1819" alt="诚友产品宣传册第 2 页" loading="lazy" decoding="async"><span class="page-number">02 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 3 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-03.webp" width="1341" height="1819" alt="诚友产品宣传册第 3 页" loading="lazy" decoding="async"><span class="page-number">03 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 4 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-04.webp" width="1341" height="1819" alt="诚友产品宣传册第 4 页" loading="lazy" decoding="async"><span class="page-number">04 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 5 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-05.webp" width="1341" height="1819" alt="诚友产品宣传册第 5 页" loading="lazy" decoding="async"><span class="page-number">05 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 6 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-06.webp" width="1340" height="1819" alt="诚友产品宣传册第 6 页" loading="lazy" decoding="async"><span class="page-number">06 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 7 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-07.webp" width="1341" height="1819" alt="诚友产品宣传册第 7 页" loading="lazy" decoding="async"><span class="page-number">07 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 8 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-08.webp" width="1341" height="1819" alt="诚友产品宣传册第 8 页" loading="lazy" decoding="async"><span class="page-number">08 / 12</span></div>

        <div class="page-shell"><img class="page-image" src="assets/page-10.webp" width="1340" height="1819" alt="诚友产品宣传册第 10 页" loading="lazy" decoding="async"><span class="page-number">10 / 12</span></div>
      </article>
      <article class="slide" aria-label="第 11 页，共 12 页">
        <div class="page-shell"><img class="page-image" src="assets/page-11.webp" width="1341" height="1819" alt="诚友产品宣传册第 11 页" loading="lazy" decoding="async"><span class="page-number">11 / 12</span></div>

        <div class="page-shell"><img class="page-image" src="assets/page-12.webp" width="1341" height="1819" alt="诚友产品宣传册联系方式页" loading="lazy" decoding="async"><span class="page-number">12 / 12</span></div>

    <nav class="rail" id="rail" aria-label="宣传册页码导航"></nav>

    <div class="bottom-hint" aria-hidden="true">
      <svg class="chevron" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>

    <footer class="site-footer">
      <span>© 广州诚友工业自动化设备有限公司</span>

    </footer>

    <p class="sr-only" id="liveStatus" aria-live="polite">当前第 1 页，共 12 页。</p>
  </main>

  <script>
    (function () {
      const app = document.getElementById('app');
      const viewer = document.getElementById('viewer');
      const slides = Array.from(document.querySelectorAll('.slide'));
      const rail = document.getElementById('rail');
      const counter = document.getElementById('counter');
      const liveStatus = document.getElementById('liveStatus');
      const progressBar = document.getElementById('progressBar');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const total = slides.length;
      let current = 0;

      const pad = (value) => String(value).padStart(2, '0');

      slides.forEach((slide, index) => {
        const dot = document.createElement('button');
        dot.className = 'dot';
        dot.type = 'button';
        dot.setAttribute('aria-label', `跳转到第 ${index + 1} 页`);
        dot.addEventListener('click', () => scrollToPage(index));
        rail.appendChild(dot);
      });

      const dots = Array.from(rail.querySelectorAll('.dot'));

      function scrollToPage(index) {
        const target = Math.max(0, Math.min(total - 1, index));
        slides[target].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function setCurrent(index) {
        current = Math.max(0, Math.min(total - 1, index));
        counter.textContent = `${pad(current + 1)} / ${pad(total)}`;
        liveStatus.textContent = `当前第 ${current + 1} 页，共 ${total} 页。`;
        progressBar.style.width = `${((current + 1) / total) * 100}%`;
        dots.forEach((dot, dotIndex) => {
          dot.setAttribute('aria-current', dotIndex === current ? 'true' : 'false');
        });
        app.classList.toggle('is-last', current === total - 1);
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === total - 1;
      }

      const observer = new IntersectionObserver((entries) => {
        const visible = entries
          .filter((entry) => entry.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (!visible) {
          return;
        }
        const index = slides.indexOf(visible.target);
        if (index !== -1) {
          setCurrent(index);
        }
      }, {
        root: viewer,
        threshold: [0.55, 0.75, 0.95]
      });

      slides.forEach((slide) => observer.observe(slide));

      prevBtn.addEventListener('click', () => scrollToPage(current - 1));
      nextBtn.addEventListener('click', () => scrollToPage(current + 1));

      window.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowDown' || event.key === 'PageDown' || event.key === ' ') {
          event.preventDefault();
          scrollToPage(current + 1);
        }
        if (event.key === 'ArrowUp' || event.key === 'PageUp') {
          event.preventDefault();
          scrollToPage(current - 1);
        }
        if (event.key === 'Home') {
          event.preventDefault();
          scrollToPage(0);
        }
        if (event.key === 'End') {
          event.preventDefault();
          scrollToPage(total - 1);
        }
      });

      setCurrent(0);
    })();
  </script>
</body>
