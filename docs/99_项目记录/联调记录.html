<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>联调记录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #111827;
      --muted: #64748b;
      --line: #dbe3ef;
      --line-strong: #c5d0df;
      --primary: #0f62fe;
      --primary-soft: #e8f0ff;
      --green: #087f5b;
      --green-soft: #e7f7ef;
      --red: #b42318;
      --red-soft: #fff1f0;
      --amber: #a15c00;
      --amber-soft: #fff4df;
      --code-bg: #eef3f8;
      --focus: #2563eb;
    }
    * { box-sizing: border-box; min-width: 0; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      letter-spacing: 0;
      overflow-x: hidden;
    }
    ::selection { background: #bfdbfe; color: #0f172a; }
    button, input, select { font: inherit; }
    button, summary { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; padding: 6px 0 20px; }
    .title-block h1 { margin: 0; font-size: clamp(24px, 3vw, 36px); line-height: 1.16; font-weight: 720; letter-spacing: 0; }
    .title-block p { margin: 10px 0 0; max-width: 790px; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
    .source-note { margin-top: 10px; color: #475569; font-size: 13px; overflow-wrap: anywhere; }
    .source-note code, .footer code, .item-copy code, .pill code, .text-block code {
      border-radius: 5px;
      background: var(--code-bg);
      color: #0f172a;
      padding: 1px 5px;
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      font-size: .92em;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .header-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .button {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--text);
      min-height: 36px;
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, color .16s ease;
    }
    .button:hover { border-color: #94a3b8; background: #f8fafc; }
    .button.primary { border-color: var(--primary); background: var(--primary); color: #fff; }
    .button.primary:hover { background: #004dd6; border-color: #004dd6; }
    .toolbar { display: grid; grid-template-columns: minmax(220px, 1fr) 190px; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .field { display: grid; gap: 6px; }
    .field label { color: #334155; font-size: 13px; font-weight: 650; }
    .field input, .field select { width: 100%; min-height: 38px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; color: var(--text); padding: 8px 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
    .stat { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 12px 14px; }
    .stat span { display: block; color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 4px; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .intro { display: grid; gap: 10px; margin-bottom: 14px; }
    .intro-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
    .intro-card summary { cursor: pointer; list-style: none; padding: 13px 16px; font-weight: 720; border-bottom: 1px solid transparent; }
    .intro-card[open] summary { border-bottom-color: var(--line); background: #fbfdff; }
    .intro-card summary::-webkit-details-marker { display: none; }
    .text-block { padding: 12px 16px 16px; color: #1f2937; font-size: 14px; overflow-wrap: anywhere; }
    .text-block pre { margin: 0; padding: 12px; overflow: auto; border-radius: 8px; background: #0f172a; color: #e5edf8; font-size: 12px; line-height: 1.7; }
    .text-block table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .text-block th, .text-block td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
    .text-block th { background: var(--surface-soft); font-weight: 720; }
    .timeline { display: grid; gap: 12px; }
    .day { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; }
    .day[open] { border-color: #b9c7da; }
    .day summary { display: grid; grid-template-columns: minmax(130px, auto) minmax(0, 1fr) auto; gap: 12px; align-items: center; cursor: pointer; list-style: none; padding: 14px 16px; border-bottom: 1px solid transparent; background: var(--surface); }
    .day[open] summary { border-bottom-color: var(--line); background: #fbfdff; }
    .day summary::-webkit-details-marker { display: none; }
    .date { font-size: 16px; font-weight: 740; font-variant-numeric: tabular-nums; }
    .day-title { min-width: 0; color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: anywhere; }
    .badge-row { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .badge, .pill { display: inline-flex; align-items: center; max-width: 100%; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-soft); color: #334155; padding: 3px 8px; font-size: 12px; line-height: 1.45; }
    .badge { white-space: nowrap; }
    .pill { min-width: 0; white-space: normal; overflow-wrap: anywhere; }
    .badge.primary { border-color: #b7ccff; background: var(--primary-soft); color: #174ea6; }
    .badge.green { border-color: #b8e6cb; background: var(--green-soft); color: var(--green); }
    .badge.red { border-color: #ffc9c5; background: var(--red-soft); color: var(--red); }
    .day-body { padding: 14px 16px 16px; display: grid; gap: 12px; }
    .entry { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
    .entry-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; background: var(--surface-soft); border-bottom: 1px solid var(--line); }
    .entry-header h2 { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 720; }
    .entry-meta { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .section-grid { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-top: 1px solid var(--line); }
    .section-grid:first-of-type { border-top: 0; }
    .section-label { padding: 12px 14px; color: #475569; background: #fbfdff; border-right: 1px solid var(--line); font-size: 13px; font-weight: 650; }
    .section-main { min-width: 0; padding: 12px 14px; }
    .item-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: item; }
    .item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; border: 1px solid #edf2f7; border-radius: 8px; background: #fff; }
    .item::before { counter-increment: item; content: counter(item); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; background: var(--code-bg); color: #334155; font-size: 12px; font-weight: 720; font-variant-numeric: tabular-nums; }
    .item-copy { min-width: 0; max-width: 100%; color: #1f2937; font-size: 14px; overflow-wrap: anywhere; word-break: break-word; }
    .artifacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .empty { border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--surface); padding: 28px; color: var(--muted); text-align: center; }
    .footer { margin-top: 22px; color: var(--muted); font-size: 12px; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 18px; }
      .header { grid-template-columns: 1fr; align-items: start; }
      .header-actions { justify-content: flex-start; }
      .toolbar { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .day summary { grid-template-columns: 1fr; gap: 6px; }
      .day-title { white-space: normal; }
      .badge-row { justify-content: flex-start; }
      .entry-header { grid-template-columns: 1fr; gap: 4px; }
      .section-grid { grid-template-columns: 1fr; }
      .section-label { border-right: 0; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
      .item { grid-template-columns: 30px minmax(0, 1fr); padding: 8px; }
    }
  </style>
</head>
<body>
  <!--
  THESIS: 联调记录需要像排查台账一样快速定位环境、链路、步骤、结果和风险，而不是只靠长 Markdown 滚动。
  OWN-WORLD: 延续项目记录 H5 的中性审计面板，用细边框、密集列表、蓝色操作和少量语义状态色表达可靠性。
  STORY: 读者先看联调范围统计，再按日期展开一次联调，核对环境、服务、中间件、测试数据、步骤、结果、问题、结论和风险。
  FIRST VIEWPORT: 标题、筛选、展开控制、统计和基础说明在首屏，日期折叠列表紧随其后。
  FORM: 文档联调控制台，基于联调记录 Markdown 的脱敏快照生成。
  -->
  <main class="shell">
    <header class="header">
      <div class="title-block">
        <h1>联调记录</h1>
        <p>按日期查看接口、环境和问题排查联调。每次联调拆成环境、服务、中间件、步骤、结果、问题、处理结论和遗留风险，便于回溯。</p>
        <div class="source-note">数据来源：<code>docs/99_项目记录/联调记录.md</code> 的脱敏快照。</div>
      </div>
      <div class="header-actions" aria-label="页面操作">
        <button class="button primary" type="button" id="expandAll">展开全部</button>
        <button class="button" type="button" id="collapseAll">收起全部</button>
      </div>
    </header>
    <section class="toolbar" aria-label="筛选联调记录">
      <div class="field"><label for="searchInput">搜索日期、主题、服务、接口、命令或结论</label><input id="searchInput" type="search" placeholder="例如：order-service、RocketMQ、健康检查、回调" autocomplete="off" /></div>
      <div class="field"><label for="typeFilter">记录类型</label><select id="typeFilter"><option value="all">全部联调</option><option value="issue">有问题/风险</option><option value="service">含服务信息</option><option value="command">含命令/接口</option></select></div>
    </section>
    <section class="stats" aria-label="联调统计"><div class="stat"><span>日期</span><strong id="dateCount">0</strong></div><div class="stat"><span>联调主题</span><strong id="entryCount">0</strong></div><div class="stat"><span>记录项</span><strong id="itemCount">0</strong></div><div class="stat"><span>当前匹配</span><strong id="matchCount">0</strong></div></section>
    <section class="intro" id="intro"></section>
    <section class="timeline" id="timeline" aria-live="polite"></section>
    <footer class="footer">H5 页面保留 Markdown 原始记录的审计口径；如更新 <code>联调记录.md</code> 后需要离线快照同步，请重新生成本页面。</footer>
  </main>
  <script>
    const EMBEDDED_MARKDOWN = "# 联调记录\n\n本文档记录接口联调、环境联调、问题排查过程和结论。正式编码后每次重要联调都应追加记录。\n\nH5 浏览入口：同目录 `联调记录.html`，按日期折叠展示联调环境、服务、中间件、步骤、结果、问题、处理结论和遗留风险。\n\n## 记录格式\n\n```text\n## YYYY-MM-DD 联调主题\n\n- 环境：\n- 涉及服务：\n- 涉及中间件：\n- 测试数据：\n- 执行步骤：\n- 结果：\n- 问题：\n- 处理结论：\n- 遗留风险：\n```\n\n## 2026-06-18 云端中间件可用性检查\n\n- 环境：云端 Ubuntu，项目专用 Docker 网络 `zhyf-net`。\n- 涉及中间件：PostgreSQL、Redis、RocketMQ NameServer、RocketMQ Broker、RocketMQ Dashboard。\n- 结果：项目专用容器已启动，PostgreSQL 可连接，Redis `PING` 正常，RocketMQ Broker 在线。\n- 结论：当前开发默认使用云端项目专用中间件，本地 Redis / RocketMQ 不作为默认依赖。\n- 遗留风险：云服务器内存较紧张，后续启动完整服务和监控组件时需要继续观察资源占用。\n\n## 第一版业务联调清单\n\n| 顺序 | 联调链路 | 验收点 |\n| --- | --- | --- |\n| 1 | 机构推单 -\u003e 订单/处方/明细落库 | 幂等、签名、IP 白名单、状态初始值正确 |\n| 2 | 订单创建 -\u003e Outbox -\u003e RocketMQ | 本地事务一致，事件可发布，消费幂等 |\n| 3 | 后台审核/调剂/复核 | 状态机合法推进，状态日志完整 |\n| 4 | PDA 模拟扫码绑定 | 重复扫码、并发扫码、超时重试可控 |\n| 5 | MES 模拟开始/完成煎煮 | 乱序、重复上报可识别，设备占用可释放 |\n| 6 | 打包出库 -\u003e 物流轨迹 -\u003e 签收 | 物流状态和订单状态联动正确 |\n| 7 | 签收/取消/异常 -\u003e 机构回调 | 回调签名、失败重试、死信、人工重放完整 |\n| 8 | 社康/医院/地址补录适配 | 外围协议兼容，差异不侵入订单主流程 |\n\n## 2026-06-19 第一阶段后端骨架验证\n\n- 环境：Windows 本地，JDK 17，Maven 3.9.2。\n- 涉及服务：`zhyf-common`、`auth-institution`、`order-service`、`prescription-service`、`message-service`、`ops-service`、`gateway`。\n- 已执行：`mvn test`。\n- 结果：后端 Maven Reactor 全模块编译和测试通过。\n- 已执行：`mvn install -DskipTests`。\n- 结果：全模块安装到本地 Maven 仓库成功，单模块启动依赖已具备。\n- 数据库联调：暂未完成。本机 `[网络地址]:15432` 无 PostgreSQL 服务，云端项目端口从本机连接超时，本机 Docker Desktop 未能稳定启动 Linux Engine。\n- 已补充：`infra/docker-compose.local-optional.yml`，仅作为本地离线备用方案，当前默认不启动本地 Docker / Redis / RocketMQ。\n- 已补充：`test/integration/create-order-smoke.ps1`，用于数据库可用后执行机构推单签名和接口冒烟验证。\n- 遗留风险：当前只完成编译级验证，真实落库和 Outbox 状态验证需要数据库环境恢复后继续执行。\n\n## 2026-06-19 云端 order-service 推单冒烟验证\n\n- 环境：云服务器 Ubuntu，项目专用 Docker 网络 `zhyf-net`。\n- 中间件状态：`zhyf-postgres`、`zhyf-redis`、`zhyf-rocketmq-namesrv`、`zhyf-rocketmq-broker`、`zhyf-rocketmq-dashboard` 均运行中。\n- 服务启动：已上传 `order-service-0.1.0-SNAPSHOT.jar` 到 `/home/ubuntu/zhyf-saas/apps/order-service/order-service.jar`。\n- 运行方式：使用 `eclipse-temurin:17-jre-alpine` 容器启动 `zhyf-order-service`，挂载 jar，连接 `zhyf-net`，服务端口 `18082`。\n- 数据库连接：`order-service` 通过容器名 `zhyf-postgres:5432` 连接 `zhyf_saas`。\n- Flyway 结果：`V1__init_core_schema.sql` 已执行成功，schema 当前版本为 `1 - init core schema`。\n- 健康检查：`GET http://[网络地址]:18082/actuator/health` 返回 `UP`。\n- 推单接口：`POST http://[网络地址]:18082/api/institution/createOrder` 返回成功。\n- 返回结果：业务码 `0`，订单状态 `CREATED`，`duplicated=false`。\n- 落库结果：`order_main=1`、`prescription=1`、`prescription_detail=1`、`order_status_log=1`、`event_outbox=1`。\n- Outbox 结果：生成 `ORDER_CREATED` 事件，状态为 `NEW`。\n- 遗留风险：`message-service` 尚未部署到云端验证 Outbox 扫描；RocketMQ 真实生产者尚未接入，当前仍是日志发布器骨架。\n\n## 2026-06-22 message-service RocketMQ 发布验证\n\n- 环境：Windows 本地 JDK 21 编译，云服务器 Ubuntu 运行容器。\n- IDE 状态：IDEA 已导入 `backend/pom.xml` 为 Maven 项目，Project SDK 为 JDK 21。\n- Maven 状态：`backend/pom.xml` 已将 `java.version` 调整为 `21`。\n- 本地验证：使用 `D:\\Javasource\\javaTools\\jdk-21.0.10` 执行 `mvn test` 通过。\n- 代码变更：`message-service` 新增 RocketMQ 真实发布器，配置 `ZHYF_MESSAGE_PUBLISHER=rocketmq` 时启用，默认仍为 logging 发布器。\n- 云端部署：上传新版 `message-service.jar`，启动容器 `zhyf-message-service`，端口 `18083`。\n- RocketMQ 修复：`zhyf-rocketmq-broker` 原 `brokerIP1=[网络地址]`，服务器和容器内访问该公网地址失败；已改为项目 Docker 网络内地址 `[网络地址]`，并重启本项目 Broker。\n- Topic：已创建 `zhyf-order-event`。\n- 发布验证：将原 `FAILED` 的 `ORDER_CREATED` Outbox 事件重置为 `NEW` 后，`message-service` 成功发送 RocketMQ，日志显示 `SEND_OK`。\n- 数据库结果：`event_outbox` 中 `ORDER_CREATED` 状态已变为 `SENT`。\n- RocketMQ 结果：`zhyf-order-event` Topic 队列最大位点已增加到 `1`。\n- 健康检查：`GET http://[网络地址]:18083/actuator/health` 返回 `UP`。\n- 遗留风险：当前只验证了生产者发布，尚未实现和验证消费者幂等处理。\n\n## 2026-06-22 云端应用容器释放\n\n- 原因：云服务器内存紧张，当前只需要云端 Redis / RocketMQ / PostgreSQL 中间件，应用服务应在本地运行和调试。\n- 已停止并删除：`zhyf-order-service`、`zhyf-message-service`。\n- 已保留：`zhyf-postgres`、`zhyf-redis`、`zhyf-rocketmq-namesrv`、`zhyf-rocketmq-broker`、`zhyf-rocketmq-dashboard`。\n- 后续策略：不默认上传 jar 到云服务器运行；本地 IDEA / Maven 启动应用服务并连接云端项目专用中间件。\n- 网络策略：如果本机无法直连云端中间件端口，优先使用 SSH 隧道或云端安全组处理，不启动本地 Redis / RocketMQ。\n\n#       if (/service|gateway|admin-web|portal|RocketMQ|PostgreSQL|Redis|Outbox/i.test(value)) return '服务';
      if (/^[a-f0-9]{7,40}$/i.test(value)) return '提交';
      return '信息';
    }
    function extractArtifacts(text) {
      const values = [];
      const codeMatches = text.match(/`([^`]+)`/g) || [];
      for (const match of codeMatches) values.push(match.slice(1, -1));
      values.push(...(text.match(/\b(?:GET|POST|PUT|DELETE|PATCH)\s+\/[A-Za-z0-9_./?=&:-]+/g) || []));
      values.push(...((text.match(/\s(\/[A-Za-z0-9_./?=&:-]+)(?=[，。、；;\s]|$)/g) || []).map((item) => item.trim())));
      return unique(values).slice(0, 10).map((value) => ({ value, type: classifyArtifact(value) }));
    }
    function hasType(record, type) {
      if (type === 'all') return true;
      const haystack = [record.title, ...record.items].join('\n');
      if (type === 'issue') return /问题|风险|失败|超时|异常|未完成|尚未/.test(haystack);
      if (type === 'service') return /service|gateway|admin-web|RocketMQ|PostgreSQL|Redis|Outbox/i.test(haystack);
      if (type === 'command') return /`(GET|POST|PUT|DELETE|PATCH|mvn|pnpm|npm|java|docker|curl|rg|git)|\b(GET|POST|PUT|DELETE|PATCH)\s+\//i.test(haystack);
      return true;
    }
    function filterRecords(records) {
      const query = state.query.trim().toLowerCase();
      return records.filter((record) => {
        const haystack = [record.date, record.title, ...record.items].join('\n').toLowerCase();
        return (!query || haystack.includes(query)) && hasType(record, state.type);
      });
    }
    function groupByDate(records) {
      const map = new Map();
      for (const record of records) {
        if (!map.has(record.date)) map.set(record.date, []);
        map.get(record.date).push(record);
      }
      return [...map.entries()].sort(([a], [b]) => b.localeCompare(a)).map(([date, entries]) => ({ date, entries }));
    }
    function renderArtifact(artifact) {
      return `<span class="pill">${artifact.type}：<code>${escapeHtml(artifact.value)}</code></span>`;
    }
    function renderValues(values) {
      return `<ol class="item-list">${values.map((value) => { const artifacts = extractArtifacts(value); const artifactHtml = artifacts.length ? `<div class="artifacts">${artifacts.map(renderArtifact).join('')}</div>` : ''; return `<li class="item"><div class="item-copy">${inlineCode(value).replace(/\n/g, '<br>')}${artifactHtml}</div></li>`; }).join('')}</ol>`;
    }
    function renderRecord(record) {
      const fields = record.fields.length ? record.fields : [{ label: '联调内容', values: record.items }];
      return `<article class="entry"><div class="entry-header"><h2>联调主题：${escapeHtml(record.title)}</h2><div class="entry-meta">${record.items.length} 条记录</div></div>${fields.map((field) => `<div class="section-grid"><div class="section-label">${escapeHtml(field.label)}</div><div class="section-main">${renderValues(field.values)}</div></div>`).join('')}</article>`;
    }
    function render(groups) {
      const totalEntries = groups.reduce((sum, group) => sum + group.entries.length, 0);
      const totalItems = groups.reduce((sum, group) => sum + group.entries.reduce((entrySum, entry) => entrySum + entry.items.length, 0), 0);
      dom.dateCount.textContent = String(groups.length);
      dom.entryCount.textContent = String(totalEntries);
      dom.itemCount.textContent = String(totalItems);
      dom.matchCount.textContent = String(totalEntries);
      if (!groups.length) { dom.timeline.innerHTML = '<div class="empty">没有匹配的联调记录。请调整搜索词或记录类型。</div>'; return; }
      dom.timeline.innerHTML = groups.map((group, index) => {
        const itemCount = group.entries.reduce((sum, entry) => sum + entry.items.length, 0);
        const issueCount = group.entries.filter((entry) => hasType(entry, 'issue')).length;
        const titlePreview = group.entries.map((entry) => entry.title).slice(0, 3).join(' / ');
        return `<details class="day" id="day-${group.date}"${index === 0 ? ' open' : ''}><summary><span class="date">${group.date}</span><span class="day-title">${escapeHtml(titlePreview)}</span><span class="badge-row"><span class="badge primary">${group.entries.length} 个主题</span><span class="badge green">${itemCount} 条记录</span>${issueCount ? `<span class="badge red">${issueCount} 个问题/风险</span>` : ''}</span></summary><div class="day-body">${group.entries.map(renderRecord).join('')}</div></details>`;
      }).join('');
    }
    const sections = parseSections(EMBEDDED_MARKDOWN);
    const records = sections.map(parseRecord).filter(Boolean);
    renderIntro(sections);
    function updateView() { render(groupByDate(filterRecords(records))); }
    dom.searchInput.addEventListener('input', (event) => { state.query = event.target.value; updateView(); });
    dom.typeFilter.addEventListener('change', (event) => { state.type = event.target.value; updateView(); });
    dom.expandAll.addEventListener('click', () => { document.querySelectorAll('details.day').forEach((detail) => { detail.open = true; }); });
    dom.collapseAll.addEventListener('click', () => { document.querySelectorAll('details.day').forEach((detail) => { detail.open = false; }); });
    updateView();
  </script>
</body>
</html>
